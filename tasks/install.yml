- name: Copy x2go.list
  copy:
    src: x2go.list
    dest: /etc/apt/sources.list.d
    owner: root
    group: root
    mode: '0644'
  register: result

- name : install keyring
  shell: |
    apt-get update --allow-insecure-repositories 2>>/dev/null
    apt-get install -y --allow-unauthenticated x2go-keyring
    apt-get update
  when: result.changed is true

- name: Install x2go
  apt:
    name: "{{ x2go_packages }}"
    state: present



